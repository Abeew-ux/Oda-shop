<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>ODA Shop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#ffffff;--card:#f6f4ee;--card2:#ece8de;--line:#e6e1d4;--txt:#17150f;--mut:#6d695d;--g:#e8b23a;--g2:#b8821a;--gt:#9a6a08;--hdr:rgba(255,255,255,.92);--navbg:rgba(255,255,255,.96);--sheet:#ffffff;--page:#e9e6dd;--herobg:radial-gradient(110% 130% at 100% 0,#e8b23a55,transparent 60%),linear-gradient(135deg,#fff6df,#f6f4ee);--tile:linear-gradient(135deg,#f3e6bf,#e6d9b6);--grab:#d4cfc2;--herobd:#ead9a8}
:root[data-theme="dark"]{--bg:#09090a;--card:#141416;--card2:#1b1b1e;--line:#2a2a2e;--txt:#f6f4ee;--mut:#9b9a93;--g:#e8b23a;--g2:#b8821a;--gt:#e8b23a;--hdr:rgba(9,9,10,.88);--navbg:rgba(16,16,18,.94);--sheet:#121214;--page:#000;--herobg:radial-gradient(110% 130% at 100% 0,#e8b23a44,transparent 60%),linear-gradient(135deg,#1c1a14,#0f0f10);--tile:linear-gradient(135deg,#2a2412,#111);--grab:#3a3a40;--herobd:#3a3220}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--page);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
#app{max-width:480px;margin:auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:96px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(14px);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--g),var(--g2));color:#111;font-weight:900;font-size:10px;line-height:1;display:grid;place-items:center;text-align:center;letter-spacing:-.3px}
.greet{flex:1;text-align:center}
.greet b{font-size:15px}.greet b span{color:var(--g)}
.greet small{display:block;color:var(--mut);font-size:12px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--g);color:var(--g)}
.ib.f{background:var(--g);color:#111}
.ib svg{width:20px;height:20px}
.cityrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px}
.cityrow .c{display:flex;gap:6px;align-items:center;color:var(--txt)}
.pill{background:var(--g);color:#111;font-weight:700;font-size:12px;padding:7px 12px;border-radius:999px}
.login{background:var(--g);color:#111;font-weight:700;border-radius:999px;padding:8px 14px;font-size:13px}
/* search */
.search{margin:12px 16px 0;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;color:var(--mut)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:15px}
.search svg{width:18px;height:18px}
main{padding:0 16px}
h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:24px 0 12px;font-weight:700}
/* hero */
.hero{margin-top:14px;border-radius:22px;padding:22px 20px;background:var(--herobg);border:1px solid var(--herobd)}
.hero h1{font-size:25px;line-height:1.12;letter-spacing:-.8px}.hero h1 span{color:var(--g)}
.hero p{font-size:13.5px;color:var(--mut);margin-top:8px}
/* tabs / chips */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-top:14px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mut)}
.seg button.on{background:var(--g);color:#111}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--mut)}
.chip.on{border-color:var(--g);color:var(--g);background:#e8b23a14}
/* products */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pr{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.pr .im{height:108px;display:grid;place-items:center;font-size:46px}
.pr .in{padding:10px 12px 12px}
.pr small{font-size:11px;color:var(--mut)}
.pr h3{font-size:14px;font-weight:600;margin:2px 0 8px;min-height:36px}
.pr .rw{display:flex;justify-content:space-between;align-items:center}
.price{font-weight:800;color:var(--g);font-size:14px}
.add{width:32px;height:32px;border-radius:10px;background:var(--g);color:#111;font-weight:900;font-size:18px}
.empty{grid-column:1/-1;color:var(--mut);text-align:center;padding:30px 0;font-size:14px}
/* services */
.svc{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border-radius:20px;padding:16px;margin-bottom:12px;border:1.5px solid var(--g);background:linear-gradient(120deg,#1a160c,#0e0e0f)}
.svc:nth-child(even){background:linear-gradient(120deg,#17171a,#0e0e0f);border-color:#3a3a40}
.svi{min-width:52px;height:52px;border-radius:16px;background:var(--g);color:#111;display:grid;place-items:center;font-size:26px}
.svc small{font-size:11px;letter-spacing:.14em;color:var(--g);text-transform:uppercase}
.svc b{display:block;font-size:17px;letter-spacing:-.2px}
.svc span{font-size:12.5px;color:var(--mut)}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.why div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}
.why b{display:block;color:var(--g);font-size:14px}.why small{font-size:11px;color:var(--mut)}
footer{text-align:center;color:var(--mut);font-size:12px;padding:26px 10px}
/* messages */
.conv{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;width:100%;text-align:left}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--g2));display:grid;place-items:center;color:#111;font-weight:900;font-size:11px}
.conv b{display:block}.conv small{color:var(--mut)}
.chat{display:flex;flex-direction:column;gap:8px;margin:14px 0;min-height:240px}
.bub{max-width:80%;padding:10px 14px;border-radius:18px;font-size:14px}
.bub.me{align-self:flex-end;background:var(--g);color:#111;border-bottom-right-radius:4px}
.bub.ot{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
.send{display:flex;gap:8px;position:sticky;bottom:90px}
.send input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--txt);font-size:15px;outline:0}
.send button{background:var(--g);color:#111;font-weight:800;border-radius:14px;padding:0 18px}
.lock{text-align:center;margin-top:60px;color:var(--mut)}
.lock div{font-size:44px;margin-bottom:10px}
.btn{display:block;width:100%;background:var(--g);color:#111;font-weight:800;font-size:15px;border-radius:14px;padding:14px;margin-top:12px;text-align:center;text-decoration:none}
.btn.o{background:none;border:1.5px solid var(--g);color:var(--g)}
/* bottom nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--navbg);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px 12px;z-index:30}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);padding:6px 0;border-radius:14px;position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--g)}
nav button.on::before{content:"";position:absolute;top:-9px;width:28px;height:3px;border-radius:3px;background:var(--g)}
/* cart bar */
#cartbar{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(120px);width:calc(100% - 32px);max-width:448px;background:var(--g);color:#111;border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;font-weight:800;z-index:35;transition:.3s;box-shadow:0 10px 30px #000a}
#cartbar.show{transform:translateX(-50%) translateY(0)}
/* sheet */
#ov{position:fixed;inset:0;background:#000a;z-index:50;opacity:0;pointer-events:none;transition:.25s}
#ov.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;max-height:85vh;overflow:auto;background:var(--sheet);border-radius:26px 26px 0 0;border:1px solid var(--line);padding:10px 18px 28px;z-index:60;transition:.3s}
#sheet.show{transform:translate(-50%,0)}
.grab{width:42px;height:4px;border-radius:4px;background:var(--grab);margin:4px auto 14px}
#sheet h3{font-size:20px;letter-spacing:-.4px}
#sheet p.s{color:var(--mut);font-size:13px;margin:4px 0 12px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}
.li small{display:block;color:var(--mut);font-size:12px}
.li .go{background:var(--g);color:#111;font-weight:700;font-size:12px;border-radius:10px;padding:8px 12px;white-space:nowrap}
.fld{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--txt);font-size:15px;margin-top:10px;outline:0}
.fld:focus{border-color:var(--g)}
.slider{margin-top:14px;position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--herobd)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;min-height:176px;display:flex;align-items:flex-end;cursor:pointer;text-align:left;background:radial-gradient(110% 130% at 100% 0,#e8b23a55,transparent 60%),linear-gradient(135deg,#1c1a14,#0f0f10)}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000d 0%,#0005 55%,#0002 100%)}
.slide .se{position:absolute;right:18px;top:16px;font-size:58px;line-height:1;filter:drop-shadow(0 4px 10px #0008)}
.slide .sc{position:relative;z-index:1;padding:18px 18px 30px;width:100%}
.slide h1{font-size:22px;line-height:1.12;letter-spacing:-.6px;max-width:82%}
.slide p{font-size:13px;color:#e6e2d6;margin-top:6px;max-width:86%}
.slide .sb{display:inline-block;margin-top:10px;background:var(--g);color:#111;font-weight:800;font-size:12px;border-radius:999px;padding:7px 14px}
.dots{position:absolute;left:0;right:0;bottom:9px;display:flex;justify-content:center;gap:6px;z-index:2}
.dots i{width:6px;height:6px;border-radius:50%;background:#fff6;transition:.25s}
.dots i.on{background:var(--g);width:18px;border-radius:6px}
.fabw{flex:1;display:flex;justify-content:center}
nav .fab{flex:none;width:54px;height:54px;padding:0;border-radius:50%;background:var(--g);color:#111;font-size:32px;font-weight:900;display:grid;place-items:center;margin-top:-28px;box-shadow:0 8px 22px #e8b23a66;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.tile{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--tile);display:grid;place-items:center;font-size:26px;padding:0}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:16px 4px 5px;font-size:10px;font-weight:700;line-height:1.15;text-align:center;color:#fff;background:linear-gradient(transparent,#000d)}
.bd{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#e8b23a22;color:var(--g);white-space:nowrap}
.bd.ok{background:#22c55e22;color:#22c55e}.bd.no{background:#ef444422;color:#ef4444}
.lb{display:block;font-size:12px;color:var(--mut);margin-top:12px}
.greet b span,.price,.why b,.chip.on,.btn.o,.ib,nav button.on{color:var(--gt)}
/* vidéos */
body.vmode header{display:none}
.vfeed{position:fixed;top:0;bottom:74px;left:50%;transform:translateX(-50%);width:100%;max-width:480px;overflow-y:auto;scroll-snap-type:y mandatory;background:#000;z-index:25;scrollbar-width:none}
.vfeed::-webkit-scrollbar{display:none}
.vi{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;background:#000;color:#fff}
.vi video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vplay{position:absolute;inset:0;display:none;place-items:center;font-size:64px;color:#fff9;pointer-events:none}
.vi.paused .vplay{display:grid}
.vinfo{position:absolute;left:0;right:0;bottom:0;padding:60px 16px 16px;background:linear-gradient(transparent,#000c);pointer-events:none}
.vinfo>*{pointer-events:auto}
.vinfo p{font-size:14px;margin:4px 0 8px;line-height:1.35}
.vprod{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#000a;border:1px solid #fff3;border-radius:14px;padding:10px 12px}
.vprod div{display:flex;flex-direction:column;font-size:13px}.vprod span{color:#e8b23a;font-weight:800}
.vprod button{background:#e8b23a;color:#111;font-weight:800;font-size:12px;border-radius:10px;padding:9px 13px;white-space:nowrap}
.vmute{position:fixed;top:14px;right:calc(50% - 240px + 14px);z-index:27;width:40px;height:40px;border-radius:50%;background:#0008;color:#fff;font-size:18px}
@media(max-width:480px){.vmute{right:14px}}
.vtop{position:fixed;top:14px;left:calc(50% - 240px + 16px);z-index:27;color:#fff;font-weight:800;font-size:17px;text-shadow:0 1px 6px #000}
@media(max-width:480px){.vtop{left:16px}}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--bg);box-shadow:0 6px 20px #0003;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.3s;z-index:70;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <div class="logo">ODA<br>SHOP</div>
      <div class="greet" id="greet"></div>
      <a class="ib f" id="call" aria-label="Appeler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></a>
      <button class="ib" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div class="cityrow">
      <div class="c">📍 Ville : <b id="city">Agadez</b></div>
      <button class="pill" id="otherCity">🛵 Commander vers une autre ville</button>
    </div>
  </header>
  <div id="view"></div>
  <div id="cartbar"><span id="cartTxt"></span><span>Commander ›</span></div>
  <nav id="nav">
    <button data-t="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
    <button data-t="vid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>Vidéos</button>
    <div class="fabw"><button class="fab" id="fab" aria-label="Publier">+</button></div>
    <button data-t="msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12z"/></svg>Messages</button>
  </nav>
</div>
<div id="ov"></div>
<div id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
// ⚠️ À remplacer par le vrai numéro WhatsApp d'ODA Shop (format international, sans +)
let WA="22700000000";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
const mem={};
/* ---- Thème : clair par défaut, sombre en option ---- */
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t=="dark"?"#0a0a0a":"#ffffff";
}
let theme=store.get("oda_theme")=="dark"?"dark":"light";applyTheme(theme);
function toggleTheme(){theme=theme=="dark"?"light":"dark";store.set("oda_theme",theme);applyTheme(theme);closeSheet();toast(theme=="dark"?"Mode sombre":"Mode clair")}
let user=null,uid=null;
let city=store.get("oda_city")||"Agadez";
let tab="home",sub="neuf",cat="all",q="",cart=[];
let chat=[{m:"Bonjour 👋 Bienvenue chez ODA Shop ! Comment pouvons-nous vous aider ?",me:false}];

const demoProds={
neuf:[
{n:"Smartphone 128 Go",p:"85 000",e:"📱",c:"Téléphones",g:"#e8b23a,#4a3510"},
{n:"Écouteurs sans fil",p:"12 000",e:"🎧",c:"Téléphones",g:"#8b5cf6,#2a1856"},
{n:"Ordinateur portable",p:"220 000",e:"💻",c:"Ordinateurs",g:"#38bdf8,#0c3550"},
{n:"Canapé 3 places",p:"150 000",e:"🛋️",c:"Meubles",g:"#f97316,#4a2008"},
{n:"Table à manger",p:"95 000",e:"🪑",c:"Meubles",g:"#a16207,#3a2503"},
{n:"Réfrigérateur",p:"180 000",e:"🧊",c:"Électroménager",g:"#22d3ee,#0b3a44"},
{n:"Téléviseur 43\"",p:"135 000",e:"📺",c:"Électroménager",g:"#6366f1,#1e1f58"},
{n:"Climatiseur",p:"165 000",e:"❄️",c:"Électroménager",g:"#2dd4bf,#0d3b36"}],
occ:[
{n:"Téléphone occasion",p:"45 000",e:"📲",c:"Téléphones",g:"#22c55e,#0f3d20"},
{n:"Laptop occasion",p:"90 000",e:"💻",c:"Ordinateurs",g:"#38bdf8,#0c3550"},
{n:"Armoire",p:"40 000",e:"🚪",c:"Meubles",g:"#a16207,#3a2503"},
{n:"Ventilateur",p:"15 000",e:"🌀",c:"Électroménager",g:"#2dd4bf,#0d3b36"},
{n:"Générateur",p:"120 000",e:"⚡",c:"Électroménager",g:"#eab308,#4a3a05"},
{n:"Moto 125cc",p:"380 000",e:"🏍️",c:"Véhicules",g:"#ef4444,#4a1111"},
{n:"Toyota Corolla 2012",p:"3 200 000",e:"🚗",c:"Véhicules",g:"#f43f5e,#4a1020"},
{n:"Vélo",p:"25 000",e:"🚲",c:"Divers",g:"#84cc16,#2d4a07"}]};

const demoServices=[
{slug:"neuf",k:"Section 1",t:"Boutique neuve",s:"Téléphones, ordinateurs, meubles, électroménager neufs",i:"🛍️",go:"home:neuf"},
{slug:"occasion",k:"Section 2",t:"Marché occasion",s:"Achetez et vendez des produits d'occasion",i:"🏷️",go:"home:occ"},
{k:"Section 3",t:"Livraison nourriture",s:"Restaurants d'Agadez livrés chez vous",i:"🍽️",items:[["Restaurant (démo) 1","Plats locaux · 30 min"],["Restaurant (démo) 2","Grillades · 40 min"],["Fast-food (démo)","Burgers, poulet · 25 min"]],cta:"Commander"},

      if(error||!ns){toast("Erreur, réessayez");$("#sv").disabled=false;return}

    openSheet(`<h3>🏪 ${esc(shop.name)}</h3><p class="s">${bd(shop.status)}</p><p class="s" style="line-height:1.5">${msg}</p><a class="btn o" target="_blank" rel="noopener" href="${wa("Bonjour ODA Shop, ma boutique « "+shop.name+" ».")}">Contacter ODA Shop</a>`);

  const {data:ps}=await sbc.from("products").select("*").eq("shop_id",shop.id).order("created_at",{ascending:false});

  <button class="btn" id="np">+ Ajouter un produit</button>
  <button class="btn o" id="nv">🎬 Publier une vidéo</button>
  ${(ps||[]).map(p=>`<div class="li" data-p="${p.id}" style="cursor:pointer"><div>${esc(p.name)}<small>${Number(p.price).toLocaleString("fr-FR")} F · stock ${p.stock}${p.reject_reason?" · "+esc(p.reject_reason):""}</small></div>${bd(p.status)}</div>`).join("")||'<p class="s" style="margin-top:14px">Aucun produit pour le moment.</p>'}`);

}
function sellerProduct(shop,p){
  const e=!!p;p=p||{name:"",price:"",section:"neuf",category:"",stock:1,description:"",image_url:"",telegram_file_id:null};
  let img=p.image_url,fid=p.telegram_file_id;
  openSheet(`<h3>${e?"Modifier":"Nouveau"} produit</h3><p class="s">${e?"Après modification, le produit repasse en validation.":"Votre produit sera visible dès qu'ODA Shop l'aura validé."}</p>
  <div style="display:flex;gap:12px;align-items:center;margin-top:10px"><div id="pv" style="width:72px;height:72px;border-radius:14px;background:var(--card);display:grid;place-items:center;overflow:hidden;font-size:26px">${img?`<img src="${esc(img)}" style="width:100%;height:100%;object-fit:cover">`:"📷"}</div><div><input type="file" id="fi" accept="image/*" hidden><button class="go" id="pk" style="background:none;border:1px solid var(--line);color:var(--txt);font-weight:700;font-size:12px;border-radius:10px;padding:8px 12px">Choisir une photo</button><div id="up" style="font-size:12px;color:var(--mut);margin-top:4px"></div></div></div>
  <label class="lb">Nom</label><input class="fld" id="n" maxlength="100" value="${esc(p.name)}">
  <label class="lb">Prix (F)</label><input class="fld" id="pr" type="number" inputmode="numeric" value="${p.price}">
  <label class="lb">Section</label><select class="fld" id="se"><option value="neuf" ${p.section=="neuf"?"selected":""}>Neuf</option><option value="occasion" ${p.section=="occasion"?"selected":""}>Occasion</option></select>
  <label class="lb">Catégorie</label><input class="fld" id="ca" value="${esc(p.category)}" placeholder="Téléphones, Meubles, Vêtements…">
  <label class="lb">Stock</label><input class="fld" id="sk" type="number" inputmode="numeric" value="${p.stock}">
  <label class="lb">Description</label><textarea class="fld" id="de" rows="3">${esc(p.description||"")}</textarea>
  <button class="btn" id="sv">Publier</button>${e?'<button class="btn o" id="dl" style="border-color:#ef4444;color:#ef4444">Supprimer</button>':""}<button class="btn o" id="bk">Retour</button>`);
  $("#bk").onclick=shopSheet;
  $("#pk").onclick=()=>$("#fi").click();
  $("#fi").onchange=async ev=>{
    const f=ev.target.files[0];if(!f)return;$("#up").textContent="Envoi de la photo…";
    try{
      const {data:{session}}=await sbc.auth.getSession();
      const fd=new FormData();fd.append("file",f);
      const r=await fetch(SB_URL+"/functions/v1/tg-upload",{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:SB_KEY},body:fd});
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.file_id){$("#up").textContent="Erreur : "+(j.error||r.status);return}
      fid=j.file_id;img=SB_URL+"/functions/v1/tg-image?id="+encodeURIComponent(fid);
      $("#pv").innerHTML=`<img src="${URL.createObjectURL(f)}" style="width:100%;height:100%;object-fit:cover">`;$("#up").textContent="Photo envoyée ✓";
    }catch(x){$("#up").textContent="Erreur réseau, réessayez"}
  };
  $("#sv").onclick=async()=>{
    const row={name:$("#n").value.trim(),price:+$("#pr").value||0,section:$("#se").value,category:$("#ca").value.trim()||"Divers",stock:+$("#sk").value||0,description:$("#de").value.trim()||null,image_url:img||null,telegram_file_id:fid,status:"en_attente",active:false,reject_reason:null};
    if(!row.name){toast("Entrez un nom");return}
    if(!img){toast("Ajoutez une photo");return}
    $("#sv").disabled=true;
    const q=e?sbc.from("products").update(row).eq("id",p.id):sbc.from("products").insert({...row,shop_id:shop.id});
    const {error}=await q;
    if(error){toast("Erreur, réessayez");$("#sv").disabled=false;return}
    toast("Produit envoyé, en attente de validation ✓");shopSheet();
  };
  if(e)$("#dl").onclick=async()=>{if(!confirm("Supprimer ce produit ?"))return;const {error}=await sbc.from("products").delete().eq("id",p.id);if(error){toast("Erreur");return}toast("Supprimé");shopSheet()};
}

/* ---------- Vidéos courtes ---------- */
let vids=[],vmuted=true,vObs=null;
const vurl=id=>SB_URL+"/functions/v1/tg-video?id="+encodeURIComponent(id);
function stopVids(){if(vObs){vObs.disconnect();vObs=null}document.querySelectorAll("#view video").forEach(v=>{try{v.pause()}catch(e){}})}
function vidView(){
  $("#view").innerHTML=`<div class="vtop">Vidéos</div><div class="vfeed" id="vf">${vids.length?vids.map((v,i)=>`<section class="vi paused" data-i="${i}"><video playsinline loop preload="none" ${vmuted?"muted":""} data-id="${esc(v.fid)}"></video><div class="vplay">▶</div><div class="vinfo"><b>🏪 ${esc(v.shop||"ODA Shop")}</b>${v.cap?`<p>${esc(v.cap)}</p>`:""}${v.prod?`<div class="vprod"><div><b>${esc(v.prod.n)}</b><span>${v.prod.p} F</span></div><button data-a="${i}">Commander</button></div>`:""}</div></section>`).join(""):`<div style="color:#fff;text-align:center;margin-top:38vh;padding:0 30px;line-height:1.6">🎬<br><b>Aucune vidéo pour le moment</b><br><span style="color:#bbb;font-size:13px">Les vendeurs peuvent en publier avec le bouton +.</span></div>`}</div><button class="vmute" id="vm" aria-label="Son">${vmuted?"🔇":"🔊"}</button>`;
  const vf=$("#vf");
  $("#vm").onclick=()=>{vmuted=!vmuted;$("#vm").textContent=vmuted?"🔇":"🔊";document.querySelectorAll(".vi video").forEach(v=>v.muted=vmuted)};
  vf.querySelectorAll(".vi").forEach(sec=>{
    const v=sec.querySelector("video");
    v.onplay=()=>sec.classList.remove("paused");v.onpause=()=>sec.classList.add("paused");
    sec.onclick=e=>{if(e.target.closest("button"))return;v.paused?v.play().catch(()=>{}):v.pause()};
  });
  vf.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const p=vids[b.dataset.a].prod;cart.push({n:p.n,p:p.p});cartUI();toast("Ajouté ✓")});
  vObs=new IntersectionObserver(es=>es.forEach(en=>{
    const v=en.target.querySelector("video");
    if(en.isIntersecting){if(!v.src)v.src=vurl(v.dataset.id);v.muted=vmuted;v.play().catch(()=>{})}else{v.pause()}
  }),{root:vf,threshold:.65});
  vf.querySelectorAll(".vi").forEach(x=>vObs.observe(x));
}
/* préparation : refuse > 2 min, compresse si besoin pour rester sous 20 Mo */
const VMAX=120,VBYTES=19*1024*1024;
function vmeta(file){return new Promise((ok,ko)=>{const v=document.createElement("video");v.preload="metadata";v.muted=true;v.playsInline=true;v.onloadedmetadata=()=>{const r={d:v.duration,w:v.videoWidth,h:v.videoHeight};URL.revokeObjectURL(v.src);ok(r)};v.onerror=()=>ko(new Error("Vidéo illisible"));v.src=URL.createObjectURL(file)})}
async function prepareVideo(file,onp){
  const m=await vmeta(file);
  if(!isFinite(m.d)||m.d<=0)throw new Error("Vidéo illisible");
  if(m.d>VMAX+1)throw new Error("Vidéo trop longue (2 minutes maximum)");
  const okType=/^video\/(mp4|webm)/.test(file.type);
  if(okType&&file.size<=VBYTES)return {file,dur:Math.round(m.d)};
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw new Error("Vidéo trop lourde (20 Mo max) et ce navigateur ne peut pas la compresser");
  const mime=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(t=>MediaRecorder.isTypeSupported(t));
  if(!mime)throw new Error("Compression impossible sur ce navigateur");
  const sc=Math.min(1,854/Math.max(m.w,m.h));
  const W=Math.round(m.w*sc/2)*2,H=Math.round(m.h*sc/2)*2;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const cx=cv.getContext("2d");
  const v=document.createElement("video");v.playsInline=true;v.src=URL.createObjectURL(file);
  await new Promise((ok,ko)=>{v.onloadeddata=ok;v.onerror=()=>ko(new Error("Vidéo illisible"))});
  const out=cv.captureStream(30);
  let ac=null;
  try{ac=new (window.AudioContext||window.webkitAudioContext)();await ac.resume();const src=ac.createMediaElementSource(v),dst=ac.createMediaStreamDestination();src.connect(dst);dst.stream.getAudioTracks().forEach(t=>out.addTrack(t))}catch(e){}
  const rec=new MediaRecorder(out,{mimeType:mime,videoBitsPerSecond:1000000,audioBitsPerSecond:64000});
  const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  const done=new Promise(ok=>rec.onstop=ok);
  let raf;const draw=()=>{cx.drawImage(v,0,0,W,H);onp&&onp(Math.min(99,Math.round(v.currentTime/m.d*100)));raf=v.requestVideoFrameCallback?v.requestVideoFrameCallback(draw):requestAnimationFrame(draw)};
  v.onended=()=>rec.state!="inactive"&&rec.stop();
  rec.start(1000);await v.play();draw();await done;
  if(v.cancelVideoFrameCallback)v.cancelVideoFrameCallback(raf);cancelAnimationFrame(raf);
  try{ac&&ac.close()}catch(e){}URL.revokeObjectURL(v.src);
  const ext=mime.includes("mp4")?"mp4":"webm";
  const blob=new Blob(chunks,{type:"video/"+ext});
  if(blob.size>VBYTES+1024*1024)throw new Error("Vidéo encore trop lourde après compression, raccourcissez-la");
  return {file:new File([blob],"video."+ext,{type:"video/"+ext}),dur:Math.round(m.d)};
}
function uploadWithProgress(file,token,onp){return new Promise(ok=>{
  const x=new XMLHttpRequest();x.open("POST",SB_URL+"/functions/v1/tg-upload");
  x.setRequestHeader("Authorization","Bearer "+token);x.setRequestHeader("apikey",SB_KEY);
  x.upload.onprogress=e=>{if(e.lengthComputable)onp(Math.round(e.loaded/e.total*100))};
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}ok({ok:x.status<300&&!!j.file_id,j,status:x.status})};
  x.onerror=()=>ok({ok:false,j:{error:"Erreur réseau"},status:0});
  const fd=new FormData();fd.append("file",file);x.send(fd)})}
async function videoSheet(shop){
  const {data:ps}=await sbc.from("products").select("id,name").eq("shop_id",shop.id).order("created_at",{ascending:false});
  const {data:mv}=await sbc.from("videos").select("*").eq("shop_id",shop.id).order("created_at",{ascending:false});
  let prep=null;
  openSheet(`<h3>🎬 Publier une vidéo</h3><p class="s">Montrez votre article en vidéo (2 minutes maximum). Elle sera visible après validation par ODA Shop.</p>
  <input type="file" id="vf" accept="video/*" hidden>
  <button class="btn o" id="vp">🎥 Choisir ou filmer une vidéo</button><div id="vs" style="font-size:12px;color:var(--mut);margin-top:6px"></div>
  <label class="lb">Légende</label><textarea class="fld" id="vc" rows="2" maxlength="200" placeholder="Ex : Canapé 3 places neuf, livraison possible"></textarea>
  <label class="lb">Produit lié (facultatif)</label><select class="fld" id="vpr"><option value="">Aucun</option>${(ps||[]).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
  <button class="btn" id="vsv">Publier la vidéo</button><button class="btn o" id="bk">Retour</button>
  ${(mv||[]).length?`<h3 style="margin-top:22px;font-size:16px">Mes vidéos</h3>`+mv.map(v=>`<div class="li"><div>${esc(v.caption||"(sans légende)")}<small>${v.duration}s · ${(v.size_bytes/1048576).toFixed(1)} Mo</small></div><div style="display:flex;gap:6px;align-items:center">${bd(v.status)}<button class="go" data-d="${v.id}" style="background:none;border:1px solid #ef4444;color:#ef4444">✕</button></div></div>`).join(""):""}`);
  $("#bk").onclick=shopSheet;
  $("#vp").onclick=()=>$("#vf").click();
  $("#vf").onchange=async ev=>{
    const f=ev.target.files[0];if(!f)return;prep=null;$("#vsv").disabled=true;
    $("#vs").textContent="Préparation de la vidéo… gardez l'écran allumé";
    try{prep=await prepareVideo(f,p=>$("#vs")&&($("#vs").textContent="Compression… "+p+"% (gardez l'écran allumé)"));
      $("#vs").textContent="Vidéo prête ✓ "+prep.dur+" s · "+(prep.file.size/1048576).toFixed(1)+" Mo"}
    catch(e){$("#vs").textContent="⚠️ "+e.message}
    $("#vsv").disabled=false;
  };
  $("#vsv").onclick=async()=>{
    if(!prep){toast("Choisissez une vidéo");return}
    $("#vsv").disabled=true;
    const {data:{session}}=await sbc.auth.getSession();
    const r=await uploadWithProgress(prep.file,session.access_token,p=>$("#vs")&&($("#vs").textContent="Envoi… "+p+"%"));
    if(!r.ok){$("#vs").textContent="⚠️ "+(r.j.error||("Erreur "+r.status));$("#vsv").disabled=false;return}
    const {error}=await sbc.from("videos").insert({shop_id:shop.id,product_id:$("#vpr").value||null,caption:$("#vc").value.trim(),telegram_file_id:r.j.file_id,duration:prep.dur,size_bytes:prep.file.size});
    if(error){$("#vs").textContent="⚠️ Erreur, réessayez";$("#vsv").disabled=false;return}
    toast("Vidéo envoyée, en attente de validation ✓");videoSheet(shop);
  };
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(!confirm("Supprimer cette vidéo ?"))return;const {error}=await sbc.from("videos").delete().eq("id",b.dataset.d);if(error){toast("Erreur");return}toast("Supprimée");videoSheet(shop)});
}
